services:
  # Backend — Express + Socket.io
  - type: web
    name: crash-game-server
    runtime: node
    region: frankfurt
    plan: free
    buildCommand: cd server && npm install --include=dev && npm run build
    startCommand: cd server && npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: CLIENT_URL
        sync: false  # Set manually after client deploys

  # Frontend — React SPA (Static Site)
  - type: web
    name: crash-game-client
    runtime: static
    buildCommand: cd client && npm install --legacy-peer-deps && npm run build
    staticPublishPath: client/dist
    headers:
      - path: /*
        name: Cache-Control
        value: public, max-age=0, must-revalidate
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_SOCKET_URL
        sync: false  # Set manually: https://crash-game-server.onrender.com
